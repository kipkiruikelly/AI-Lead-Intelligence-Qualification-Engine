# ═══════════════════════════════════════════════════════════════
#  AI Lead Intelligence & Qualification Engine — Configuration
# ═══════════════════════════════════════════════════════════════

target:
  industries:
    - financial services
    - banking
    - technology
    - healthcare
    - logistics
  geography:
    - Kenya
    - Nairobi
  employee_min: 20
  employee_max: 500
  max_leads: 30
  keywords:
    - digital
    - cloud
    - payments
    - software

providers:
  discovery:
    primary: web_search        # "web_search" for live mode (or "seed_file_demo" if demo mode)
  research:
    website_scrape: true

scoring:
  high_threshold: 70
  medium_threshold: 50

llm:
  enabled: true
  provider: gemini             # "gemini" | "openai"
  gemini_model: gemini-2.0-flash
  openai_model: gpt-4o-mini

retry:
  max_attempts: 3
  backoff_seconds: [2, 5, 10]

output:
  directory: output
  db_path: output/leads_repository.db

enrichment:
  website_check_timeout: 8
  skip_website_check: false
